{% extends 'base.html' %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <i class="fa-solid fa-shield-halved auth-icon"></i>
            <h2>SAVTEX Sign In</h2>
            <p>Access Texas Emergency Operations Center</p>
        </div>

        <form action="{{ url_for('login') }}" method="POST" class="auth-form">
            <div class="form-group">
                <label for="email"><i class="fa-solid fa-envelope"></i> Email Address</label>
                <input type="email" id="email" name="email" required placeholder="name@texas.gov or user@email.com">
            </div>

            <div class="form-group">
                <label for="password"><i class="fa-solid fa-lock"></i> Password</label>
                <input type="password" id="password" name="password" required placeholder="Enter password">
            </div>

            <button type="submit" class="btn btn-primary btn-full"><i class="fa-solid fa-right-to-bracket"></i> Sign In</button>
        </form>

        <p class="auth-footer">Don't have an account? <a href="{{ url_for('signup') }}">Register Area Account</a></p>
    </div>
</div>
{% endblock %}
